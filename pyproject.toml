[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tcga-survival-fm"
version = "0.1.0"
description = "Frozen pathology foundation-model embeddings plus attention MIL survival modeling for TCGA solid tumors."
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = { text = "MIT" }
dependencies = [
  "huggingface-hub>=0.24",
  "numpy>=1.24",
  "pillow>=10",
  "timm>=0.9.16",
  "torch>=2.2",
  "torchvision>=0.17",
  "tqdm>=4.66",
  "transformers>=4.44",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
tcga-survival = "tcga_survival.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

