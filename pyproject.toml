[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tcga-survival-fm"
version = "0.1.0"
description = "Frozen pathology foundation-model embeddings plus attention MIL survival modeling for TCGA solid tumors."
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = { text = "MIT" }
dependencies = [
  "huggingface-hub>=0.24",
  "numpy>=1.24",
  "pillow>=10",
  "timm>=0.9.16",
  "torch>=2.2",
  "torchvision>=0.17",
  "tqdm>=4.66",
  "transformers>=4.44",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.9.0",
  "bandit>=1.7",
  "mypy>=1.10",
  "pre-commit>=4",
]

[project.scripts]
tcga-survival = "tcga_survival.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "S",    # flake8-bandit
]
ignore = [
  "E501",  # line too long (handled by formatter)
  "S101",  # assert used (fine for tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"scripts/*" = ["S311"]  # non-cryptographic random ok for synthetic data

[tool.bandit]
exclude_dirs = ["tests", ".venv", "scripts"]
skips = ["B311"]  # standard random is fine for non-crypto use cases

[tool.mypy]
python_version = "3.9"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
