name: tcga-survival-fm
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.9,<3.13
  - pip
  - pip:
    # PyTorch CUDA 12.4 wheels (set extra index URL so cu124 builds are picked).
    - --extra-index-url https://download.pytorch.org/whl/cu124
    - torch==2.4.1
    - torchvision==0.19.1
    - h5py>=3.10
    - huggingface-hub>=0.24
    - numpy>=1.24
    - pillow>=10
    - timm>=0.9.16
    - tqdm>=4.66
    - transformers>=4.44
    - pytest>=8
    - pytest-cov>=5
